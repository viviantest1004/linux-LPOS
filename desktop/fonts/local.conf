<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  /etc/fonts/local.conf - which face every application gets, and how it
  is rasterised, on a 15.6" 3840x2160 panel (282 ppi) at output scale 2.

  fontconfig answers every "sans-serif", "monospace" and "emoji" that a
  GTK widget, foot or Firefox asks for, and it is also the last word on
  antialiasing and hinting: the rules below with target="font" run after
  the toolkit has said what it would like, so they are what reaches the
  rasteriser. Everything here was checked with fc-match and with
  screenshots of GTK 3, GTK 4, foot and Firefox at 3840x2160 scale 2;
  desktop/graphics/README.md says how to repeat that on the machine.

  Rendering. At 282 ppi a 14px interface line is 28 device pixels tall.
  Subpixel (RGB) antialiasing buys a third of a pixel of horizontal
  resolution that nobody can see at that density, and it costs colour
  fringes the moment anything is rotated or scaled - the panel is a touch
  screen and gets used in portrait - and wherever a compositor blends a
  surface that is not pixel-aligned (every animation). So: greyscale
  antialiasing, no LCD filter. Hinting is "slight": it only snaps
  vertical metrics (x-height, baseline, cap height) to the pixel grid and
  leaves the horizontal shapes alone, so Hangul keeps its proportions and
  stems land on whole pixels. "hintnone" was compared side by side at the
  same sizes (desktop/graphics/README.md, "Fonts"): equally good
  horizontally, but its horizontal strokes (Hangul's ㅡ, the bar of T and
  e) straddle two pixel rows and read half a shade lighter - 51.7% of the
  inked pixels fully solid against 54.2% with slight hinting, on the same
  specimen. "hintfull" rendered pixel-identical to "slight" with this
  FreeType (its v40 interpreter ignores horizontal hints), so there is
  nothing to gain from asking for more. The autohinter is off: Noto CJK
  carries its own hints, and forcing the autohinter onto hinted faces is
  how stems change weight from one size to the next.

  Embedded bitmaps are off. NanumGothic and several older CJK faces carry
  hand-made bitmap strikes for 9-16px; at scale 2 those sizes are asked
  for at twice the pixel size, where fontconfig can still pick a strike
  from a face that has one and scale it, and that is what "jagged Korean"
  looks like. The one exception is colour: Noto Color Emoji IS a set of
  bitmaps (CBDT), and with embedded bitmaps off cairo draws every emoji
  as an empty box, so faces that fontconfig reports as colour keep them.

  Families. The design system (design/feel.md 1-3 on the gui branch)
  sets Pretendard for the interface and D2Coding for the terminal; both
  are fetched by tools/fetch-fonts.sh because Debian carries neither.
  Two things decide whether that choice actually reaches the screen:

  * The binding is strong. A family added with the default (weak)
    binding loses to a font that "supports the language" of the text,
    and fontconfig does not count Pretendard as supporting Korean - it
    has all 11,172 modern syllables but not the archaic compatibility
    jamo (U+3165-318E) that fontconfig's ko orthography lists. In a
    Korean session every generic sans-serif therefore came back as Noto
    Sans CJK KR, Latin letters included. Strong binding ranks the family
    above the language test.

  * The fallback order is chosen, not inherited. Pretendard has no Hanja
    and no conjoining jamo, so Noto Sans CJK KR follows it (per glyph, not
    per string); DejaVu Sans is left for symbols only. DejaVu Sans also has
    76 black-and-white emoji, and it must not be reached before Noto
    Color Emoji for those - Pango tags emoji runs with the language
    und-zsye, which only the emoji face claims, so the emoji face is found
    by language as long as nothing strong-bound in front of it has the
    glyph.

  Han characters take their shape from the language: the same code point
  is drawn differently for Korean, Japanese, Simplified and Traditional
  Chinese. The owner reads Korean, so untagged Han is Korean: Pango leaves
  the language of a Han run undetermined in both the English and the
  Korean session (measured), and the fallback order below then reaches
  Noto Sans CJK KR first; Firefox is told the same with
  font.cjk_pref_fallback_order. Text that says it is Japanese or Chinese
  gets its own face in front, and so does kana, which Pango tags ja.
-->
<fontconfig>

  <!-- ── Rendering ──────────────────────────────────────────────── -->

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Colour faces are bitmaps; see the header. -->
  <match target="font">
    <test name="color"><bool>true</bool></test>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>

  <!-- ── Han glyph forms by language ────────────────────────────── -->
  <!--
    These run before the generic rules below and put the right regional
    face at the very front (prepend_first), so a run tagged ja gets
    Japanese kanji and kana, and Latin from the same face so the two sit
    on one baseline. Pretendard is deliberately not in front for these:
    it has kana of its own, and kana from one face beside kanji from
    another is visibly uneven.
  -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans Mono CJK JP</string></edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-sg</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-mo</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans CJK HK</string></edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif CJK TC</string></edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans Mono CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans Mono CJK HK</string></edit>
  </match>

  <!-- ── Names that pages and documents ask for ─────────────────── -->
  <!--
    Anything fontconfig does not know falls back to sans-serif, which is
    Pretendard, so Malgun Gothic, Apple SD Gothic Neo, Dotum or Segoe UI
    need no rule. What does need one is a name whose generic is NOT
    sans-serif: a Korean serif (a page asking for Batang wants a Myeongjo,
    not a Gothic), the fixed-width Korean faces, the programming faces,
    and the other platforms' emoji faces. These must come before the
    generic rules below and must insert the generic right after the name
    ("append"): 49-sansserif.conf has already put sans-serif at the end
    of any family it did not recognise, and a generic added after that
    would lose to it. Helvetica, Arial, Times and Courier are mapped by
    30-metric-aliases.conf to the URW faces with the same widths, which
    keeps page layouts intact, and are left alone.
  -->
  <match target="pattern"><test name="family"><string>Batang</string></test><edit name="family" mode="append" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family"><string>바탕</string></test><edit name="family" mode="append" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family"><string>Gungsuh</string></test><edit name="family" mode="append" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family"><string>궁서</string></test><edit name="family" mode="append" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family"><string>Noto Serif KR</string></test><edit name="family" mode="append" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family"><string>AppleMyungjo</string></test><edit name="family" mode="append" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family"><string>BatangChe</string></test><edit name="family" mode="append" binding="strong"><string>monospace</string></edit></match>
  <match target="pattern"><test name="family"><string>DotumChe</string></test><edit name="family" mode="append" binding="strong"><string>monospace</string></edit></match>
  <match target="pattern"><test name="family"><string>GulimChe</string></test><edit name="family" mode="append" binding="strong"><string>monospace</string></edit></match>
  <match target="pattern"><test name="family"><string>GungsuhChe</string></test><edit name="family" mode="append" binding="strong"><string>monospace</string></edit></match>
  <match target="pattern"><test name="family"><string>Consolas</string></test><edit name="family" mode="append" binding="strong"><string>monospace</string></edit></match>
  <match target="pattern"><test name="family"><string>Menlo</string></test><edit name="family" mode="append" binding="strong"><string>monospace</string></edit></match>
  <match target="pattern"><test name="family"><string>Monaco</string></test><edit name="family" mode="append" binding="strong"><string>monospace</string></edit></match>
  <match target="pattern"><test name="family"><string>SF Mono</string></test><edit name="family" mode="append" binding="strong"><string>monospace</string></edit></match>
  <match target="pattern"><test name="family"><string>ui-monospace</string></test><edit name="family" mode="append" binding="strong"><string>monospace</string></edit></match>
  <match target="pattern"><test name="family"><string>Cascadia Code</string></test><edit name="family" mode="append" binding="strong"><string>monospace</string></edit></match>
  <match target="pattern"><test name="family"><string>Source Code Pro</string></test><edit name="family" mode="append" binding="strong"><string>monospace</string></edit></match>
  <match target="pattern"><test name="family"><string>Apple Color Emoji</string></test><edit name="family" mode="append" binding="strong"><string>emoji</string></edit></match>
  <match target="pattern"><test name="family"><string>Segoe UI Emoji</string></test><edit name="family" mode="append" binding="strong"><string>emoji</string></edit></match>
  <match target="pattern"><test name="family"><string>Segoe UI Symbol</string></test><edit name="family" mode="append" binding="strong"><string>emoji</string></edit></match>
  <match target="pattern"><test name="family"><string>Noto Emoji</string></test><edit name="family" mode="append" binding="strong"><string>emoji</string></edit></match>
  <match target="pattern"><test name="family"><string>Twemoji</string></test><edit name="family" mode="append" binding="strong"><string>emoji</string></edit></match>

  <!-- ── The generic families ───────────────────────────────────── -->
  <!--
    prepend (not prepend_first) puts these right before the generic name
    itself, so a family an application asked for by name still comes
    first and these become its fallback.
  -->
  <!--
    The generic rules below bind with the generic's own strength
    ("same"): strong when the application asked for "sans-serif" itself,
    weak when fontconfig added it as the fallback of a family that is not
    installed. That keeps 30-metric-aliases.conf working - Arial still
    becomes Nimbus Sans, which has Arial's widths, and a page laid out for
    Arial does not reflow. In a Korean session that weak fallback loses
    to the language test (see the header), so an application asking for
    any missing face - Malgun Gothic, Cantarell, Arial - got Noto Sans CJK
    KR instead of the interface face. For Korean the three generics are
    therefore bound strongly; nothing metric-compatible is lost by it,
    because in Korean the language test had already overruled the metric
    aliases before this file existed.
  -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Pretendard Variable</string>
      <string>Pretendard</string>
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK KR</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>D2Coding</string>
      <string>Noto Sans Mono CJK KR</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="same">
      <string>Pretendard Variable</string>
      <string>Pretendard</string>
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>

  <!-- Firefox and GTK both ask for system-ui for "the interface font". -->
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="same">
      <string>Pretendard Variable</string>
      <string>Pretendard</string>
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>

  <!--
    Serif: Noto Serif CJK KR for both scripts. DejaVu Serif is the only
    other serif Latin here besides the URW Times clone, and it is wide
    enough that a mixed Korean/English serif paragraph looks like two
    fonts; Noto Serif CJK's own Latin was drawn to sit beside its Hangul.
  -->
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="same">
      <string>Noto Serif CJK KR</string>
    </edit>
  </match>

  <!--
    Monospace: D2Coding draws every Hangul syllable exactly two columns
    wide, which is what keeps a Korean file name from shearing the
    columns of `ls -l`. Noto Sans Mono CJK KR covers what D2Coding lacks
    (old Hangul, most Hanja) at the same two-column width.
  -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="same">
      <string>D2Coding</string>
      <string>Noto Sans Mono CJK KR</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>emoji</string></test>
    <edit name="family" mode="prepend" binding="same">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

</fontconfig>
