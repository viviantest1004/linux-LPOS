# Written by Settings > Keyboard from ~/.config/wayfire.ini, the one list
# of shortcuts for both compositors; sway's config includes it. Change the
# shortcuts in Settings: this file is written again at every change and
# at every login.
bindcode --no-warn Mod4+24 kill
bindcode --no-warn Mod1+70 kill
bindcode --no-warn Mod4+111 maximize toggle
bindcode --no-warn Mod4+58 maximize toggle
bindcode --no-warn Mod4+116 minimize
bindcode --no-warn Mod4+43 minimize
bindcode --no-warn Mod4+41 fullscreen toggle
bindcode --no-warn 95 fullscreen toggle
bindcode --no-warn Mod4+113 maximize disable, resize set width 50ppt height 100ppt, move position 0 0
bindcode --no-warn Mod4+114 maximize disable, resize set width 50ppt height 100ppt, move position 50ppt 0
bindcode --no-warn Mod1+23 focus next
bindcode --no-warn Mod1+Shift+23 focus prev
bindcode --no-warn Mod4+Ctrl+113 workspace prev_on_output
bindcode --no-warn Mod4+Ctrl+114 workspace next_on_output
bindcode --no-warn Mod4+Ctrl+Shift+113 move container to workspace prev_on_output, workspace prev_on_output
bindcode --no-warn Mod4+Ctrl+Shift+114 move container to workspace next_on_output, workspace next_on_output
bindcode --no-warn Mod4+65 exec lp-input-lang toggle
bindcode --no-warn Mod4+28 exec kgx
bindcode --no-warn Ctrl+Mod1+28 exec kgx
bindcode --no-warn Mod4+36 exec kgx
bindcode --no-warn Mod4+26 exec lp-files
bindcode --no-warn Mod4+31 exec lp-settings
bindcode --no-warn Ctrl+Shift+9 exec lp-tasks
bindcode --no-warn Mod4+38 exec lp-appgrid toggle
bindcode --no-warn Mod4+57 exec lp-quick toggle
bindcode --no-warn Mod4+46 exec lp-lock
bindcode --no-warn Mod4+45 exec lp-osk toggle
bindcode --no-warn 107 exec lp-screenshot full
bindcode --no-warn Shift+107 exec lp-screenshot area
bindcode --no-warn Mod4+Shift+39 exec lp-screenshot area
bindcode --no-warn Mod1+107 exec lp-screenshot window
bindcode --no-warn Ctrl+Shift+107 exec lp-shot
bindcode --no-warn 123 exec sh -c 'wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+; lp-panel refresh'
bindcode --no-warn 122 exec sh -c 'wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-; lp-panel refresh'
bindcode --no-warn 121 exec sh -c 'wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle; lp-panel refresh'
bindsym --no-warn XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindcode --no-warn 233 exec lp-tune brightness set +5
bindcode --no-warn 232 exec lp-tune brightness set -5
bindcode --no-warn 172 exec playerctl play-pause
bindcode --no-warn 171 exec playerctl next
bindcode --no-warn 173 exec playerctl previous
bindcode --no-warn Ctrl+Mod1+119 exec lp-quick confirm logout
bindcode --no-warn Ctrl+Mod1+22 exec lp-logout
