// lp-firefox.cfg - Firefox autoconfig: colour management for the panel.
// (Autoconfig skips the first line of this file, so it must be a comment.)
//
// Installed as /usr/lib/firefox-esr/lp-firefox.cfg and named by
// general.config.filename in /etc/firefox-esr/lp-graphics.js.
//
// Why a script and not a pref file: whether colour management should be
// switched on depends on whether this machine has a panel profile, and
// where it is. The session answers that (graphics-env.sh runs
// lp-display-icc, which builds an ICC profile from the built-in panel's
// EDID) by exporting LP_DISPLAY_ICC; autoconfig is the one place a
// Firefox preference can be set from the environment.
//
// With a profile: mode 1 converts EVERYTHING Firefox draws - untagged
// images, CSS colours, video - from sRGB to the panel, which is what
// stops sRGB content looking oversaturated on a wide-gamut panel. Mode 2,
// Firefox's default, only converts images that carry their own profile,
// which on the web is a small minority.
//
// Without one (a virtual machine, an external monitor only, an EDID
// with no usable colour data): nothing is set, Firefox keeps mode 2 and
// the sRGB assumption, which is right for an sRGB screen.
//
// These are defaultPref: about:config can still override both.

var lpIcc = getenv("LP_DISPLAY_ICC");
if (lpIcc) {
    defaultPref("gfx.color_management.display_profile", lpIcc);
    defaultPref("gfx.color_management.mode", 1);
}
