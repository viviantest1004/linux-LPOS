# mpv.conf - the system-wide defaults for mpv, installed as
# /etc/mpv/mpv.conf (Debian's mpv reads it before ~/.config/mpv/mpv.conf,
# so a person's own file still overrides any line here).
#
# Written for mpv 0.35 (bookworm) on the XPS 15: an Intel HD 530, a
# 3840x2160 panel at output scale 2, native Wayland. Every option below
# was checked against `mpv --list-options` of that build, and the file
# was loaded by it without a warning (desktop/graphics/README.md).

# ── Decoding ──────────────────────────────────────────────────────
# VA-API through Intel's iHD driver (LIBVA_DRIVER_NAME is set by
# /etc/lp/graphics-env.sh). On Skylake that decodes H.264, HEVC 8-bit,
# VP8, MPEG-2 and VC-1 in fixed-function hardware - a 4K HEVC file plays
# at a few percent CPU instead of pinning four cores. VP9 and AV1 have no
# decoder on this GPU and fall back to the CPU by themselves, as does
# everything in a virtual machine, with one line in the log and no
# failure. "vaapi" rather than "auto": auto-safe also tries VDPAU and
# NVDEC, which on this machine could only mean waking the GTX 960M.
hwdec=vaapi

# ── Output ────────────────────────────────────────────────────────
# The GPU video output, which on Wayland opens its own EGL surface at
# the output's scale, so video is drawn at the panel's full 3840x2160
# instead of at 1920x1080 and stretched by the compositor.
vo=gpu

# Scaling. Most video is 1080p or less, shown on a 4K panel, so the
# upscaler is the one that is always on screen: spline36 is sharp without
# the ringing of lanczos, and cheap enough for the HD 530 at 4K 60 Hz.
# Chroma is upscaled 4x in each direction on the way, and gets the same
# filter. Sigmoid upscaling keeps dark halos off bright edges.
# Downscaling (4K video in a window) uses mitchell in linear light, with
# correct-downscaling so the filter widens with the ratio instead of
# skipping pixels and aliasing.
scale=spline36
cscale=spline36
dscale=mitchell
sigmoid-upscaling=yes
correct-downscaling=yes
linear-downscaling=yes

# The panel is 8-bit and most video is 8-bit 4:2:0 converted to RGB in
# floating point - dithering the result back to the panel's depth
# removes the banding that otherwise shows in skies and dark gradients.
dither-depth=auto

# Debanding stays off: it costs a full-resolution pass per frame for
# a problem only badly encoded files have. Run mpv with --deband, or type
# "cycle deband" in its console (the ` key), when a file needs it.
deband=no

# ── Colour ────────────────────────────────────────────────────────
# The panel is wide-gamut, and video is BT.709 (the sRGB primaries). When
# lp-display-icc has built a profile of the panel, it also writes
# ~/.local/share/icc/lp-mpv.conf, holding icc-profile= and icc-cache-dir=
# lines, and mpv converts every frame into the panel's gamut with a 3D
# LUT on the GPU (built once, then cached). When there is no profile the
# file does not exist and mpv skips a missing include silently, so this
# costs nothing on a machine that does not need it.
include="~/.local/share/icc/lp-mpv.conf"

# ── Text ──────────────────────────────────────────────────────────
# The OSD and subtitles ask fontconfig for sans-serif, which is Pretendard
# with Noto Sans CJK KR behind it (/etc/fonts/local.conf), so Korean
# subtitles and the OSD use the desktop's face without naming it here.
