# The launcher. Ctrl+Space, as the shortcut list already promises.
#
# §4-3 of the spec: it opens showing nothing but the field. A launcher
# that lists every application the moment it opens invites people to
# scan the list with their eyes, and then it is a menu rather than a
# search - which is slower for everyone who knew what they wanted.
[main]
font=Pretendard:size=11
terminal=/usr/bin/foot
layer=overlay
width=34
lines=8

# 이 베이스의 fuzzel 은 1.8.2 이고, 그 버전이 못 하는 것이 둘 있다.
# 둘 다 여기 적어 두는 이유는 나중에 "왜 명세대로가 아니지" 를 다시
# 조사하지 않기 위해서다.
#
# 1. anchor. 명세서 4-1 은 결과가 상단바 바로 아래로 펼쳐지기를
#    요구하고 그것을 적는 설정이 anchor 인데, anchor 는 1.9 에서
#    생겼다. 1.8 에 적으면 설정 파일 전체가 거부되어 런처가 아예
#    뜨지 않는다 - 무시되는 것이 아니라 거부된다. 그래서 지금은
#    기본값인 화면 가운데에 뜬다.
#
#      anchor=top-left
#      x-margin=64
#      y-margin=30
#
# 2. .desktop 의 Name[ko]. 1.8 은 Name= 만 읽으므로 계산기가
#    Calculator 로, 문서 뷰어가 Document Viewer 로 나온다. 로케일은
#    제대로 걸려 있고(시계가 '일 03:19' 로 나온다) 앱 자체의 UI 도
#    한국어다 - 런처에 보이는 이름만 영어다.
#
# fuzzel 이 1.9 이상이 되면 둘 다 저절로 해결되고, 위 세 줄을
# 되살리면 된다.
horizontal-pad=14
vertical-pad=12
inner-pad=8
line-height=22

[colors]
background=1a1a1ae8
text=a8a8a8ff
match=e8e8e8ff
selection=2c2c2cff
selection-text=e8e8e8ff
selection-match=f0b350ff
border=333333ff

[border]
width=1
radius=8
