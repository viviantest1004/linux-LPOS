# /etc/xdg/foot/foot.ini
#
# apps-and-settings.md 2-4: the terminal is not written here, it is foot
# with this system's defaults. Everything below is a value from that
# section or from the shell design spec's colour roles, and nothing else
# is set - foot's own defaults are good and a config that restates them
# is a config that drifts.

# shell 이 /bin/false 로 잡히면 창이 열리자마자 닫힌다. 이 기계의 로그인
# 셸은 우리 셸이고, 터미널이 여는 것도 그것이어야 한다.
# shell= is left unset: foot runs $SHELL, which the session takes from
# the account (lpsh). /bin/sh is dash on the desktop root (lp-base keeps
# Debian's /bin/sh), and naming it here gave a bare "$ " with no line
# editor and no history.
term=xterm-256color
app-id=foot

# 2-4: D2Coding 14px, 여백 12px, 모서리 10px.
# foot 은 pt 로 받는다. 96dpi 에서 14px = 10.5pt.
font=D2Coding:size=10.5
pad=12x12

[main]
# 커서가 있는 줄을 읽기 쉽게. 기본값은 너무 얇다.
# foot takes this in points, like the font: 14.5pt is 19px at 96dpi, 1.36x
# the 14px face. It said 19 - meant as pixels, read as points (25px), and
# every line of output had a blank line's worth of gap under it.
line-height=14.5

[colors]
# The theme's deep blue for the page, near-white for the text.
background=0f1e2c
foreground=e6eef5

# 회색 5단계와 역할 색만. 8색 팔레트에 임의의 색을 넣으면 ls 와 grep 이
# 시스템에 없는 색을 칠하기 시작한다.
regular0=2c2c2c
regular1=e05252
regular2=7fb8a0
regular3=f0b350
regular4=6f9dc8
regular5=b08cc8
regular6=79b8b8
regular7=a8a8a8

bright0=4a4a4a
bright1=f07070
bright2=98cfb8
bright3=f5c77a
bright4=8ab4dd
bright5=c4a5d8
bright6=95cfcf
bright7=e8e8e8

# 선택 영역은 사이드바 선택색과 같은 값.
selection-foreground=e6eef5
selection-background=1c3b57

[cursor]
style=beam
blink=no
# The orange accent: the one thing on the page that is where you type.
color=0f1e2c f28c28

[csd]
# foot draws its own title bar - title, minimise, maximise, close - when
# the compositor lets it. Under sway (a machine with no 3D graphics)
# that is the only way the terminal gets those buttons: sway draws no
# buttons of its own and honours a floating window's request to
# decorate itself. Under wayfire the compositor's frame looks the same.
preferred=client
size=34
font=Pretendard Variable:size=10
color=ff16304a
button-width=40
button-color=ffeaf2f8
button-minimize-color=ff16304a
button-maximize-color=ff16304a
button-close-color=ffe8663d

[scrollback]
lines=10000

[key-bindings]
# 복사·붙여넣기는 Ctrl+Shift. Ctrl+C 는 셸에 가야 한다.
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
