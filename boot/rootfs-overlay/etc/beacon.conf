# beacon.conf - where this board reports how it is doing.
#
# The board is meant to run for months with nobody near it. The only way
# to know it is still doing that is for it to say so on a schedule, to
# somewhere that is not the board - because if it stops saying so, that
# is the signal, and it is the only signal that still works when the
# failure is "it went away".
#
# url: anywhere that expects a periodic ping and complains when one is
# missed. Several free services have exactly that shape; nothing here is
# specific to any of them. The report is JSON in the POST body, which
# those services keep as the ping's note:
#
#   {"name":"kitchen-pi","uptime_s":864000,"boots":3,"load":0.04,
#    "mem_available_kb":401232,"data_free_mb":1191,"temp_c":47,
#    "undervolted_ever":false,"address":"wlan0:192.168.0.42", ...}
#
# Leave it commented out and the board still keeps the same report in
# /data/log/status.json and appends it to /data/log/status.log. Half the
# value is having the numbers at all.
#
# url https://your.monitor/ping/00000000-0000-0000-0000-000000000000

# How often, in seconds. Minimum 60 - anything faster is not monitoring,
# it is a denial of service against whoever agreed to receive it.
interval 300

# What to call this board in the report. Defaults to its hostname.
# name kitchen-pi
