# wpa_supplicant.conf - WiFi settings.
#
# *** Replace ssid and psk with your own router's. ***
#
# A file of the same name on the SD card's data partition (/data) takes
# precedence over this one, so the password can be changed without
# burning the card again.
#
# Supported: WPA2-PSK. WPA3 (SAE) was left out of the build, because its
# internal crypto needs elliptic curve arithmetic we do not carry. If the
# router is WPA3-only, switch it to WPA2/WPA3 mixed mode.

ctrl_interface=/var/run/wpa_supplicant
update_config=1

network={
    ssid="YOUR_NETWORK_NAME"
    psk="YOUR_PASSWORD"
    key_mgmt=WPA-PSK
}
