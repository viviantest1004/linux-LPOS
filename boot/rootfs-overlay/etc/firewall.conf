# firewall.conf - what else is allowed to reach this machine.
#
# The firewall is on by default. Without touching this file it accepts:
#
#   - replies to connections this machine made
#   - anything on the loopback interface
#   - SSH on port 22, with new connections limited to 30 a minute
#   - ping, and all of ICMPv6 (IPv6 stops working without it)
#
# and drops everything else. Nothing here can lock you out of SSH: port
# 22 is opened by the firewall itself, not by this file.
#
# Edit this file from any computer with an SD card reader and reboot, or
# run `firewall boot` on the machine to apply it now.

# mode: on | strict | off
#
#   on       the policy above. This is the default.
#   strict   the same, and the machine may only talk out on DNS, NTP,
#            HTTP, HTTPS, SSH and ICMP. This is what stops something
#            that got onto the board from phoning home on a port of its
#            choosing - at the cost of breaking anything of yours that
#            connects out somewhere else.
#   off      no rules at all.
mode on

# Extra ports to accept. One per line.
#
#   tcp 8080        a web server you are running
#   udp 5353        mDNS, so the machine answers to lpzero.local
#
# Uncomment what you need.
# tcp 8080
# udp 5353
